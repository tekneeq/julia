# /etc/nginx/conf.d/julia-dashboard.conf
#
# Nginx reverse-proxies http://<host>/ → Streamlit at 127.0.0.1:8501.
# Streamlit relies on a persistent WebSocket for its live updates, so
# we need the Upgrade/Connection headers + long read/send timeouts, or
# the page will white-screen after a few seconds.
#
# Deploy with:
#   sudo cp scripts/nginx-julia-dashboard.conf /etc/nginx/conf.d/julia-dashboard.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 200M;

    # Health probe (useful for LB checks or `curl` sanity)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — required for Streamlit's live reload / auto-refresh
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Streamlit's WS is long-lived. Default 60s makes the socket drop
        # every minute and the page reconnects noisily — bump to 24h.
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;

        # Don't buffer the streaming HTML/WS — pass bytes through immediately
        proxy_buffering off;
    }
}
