services:
  dashboard:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_COMMIT_TIME: ${GIT_COMMIT_TIME:-unknown}
    image: julia-dashboard:latest
    container_name: julia-dashboard
    ports:
      - "8501:8501"
    volumes:
      # Persist SQLite DB, generated PNGs, and batch logs on the host.
      - ./.options_cache:/app/.options_cache
      - ./plots:/app/plots
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      JULIA_GIT_SHA: ${GIT_SHA:-unknown}
      JULIA_GIT_COMMIT_TIME: ${GIT_COMMIT_TIME:-unknown}
    restart: unless-stopped
