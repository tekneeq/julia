[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "julia"
version = "0.1.0"
description = "Options Greeks and Gamma Exposure Analysis toolkit"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Julia Options Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.8",
    "markupsafe==3.0.2",
    "matplotlib>=3.11.0",
    "numpy>=2.0.2",
    "pandas>=2.2.3",
    "python-dotenv>=1.1.0",
    "robin-stocks>=3.4.0",
    "ruff>=0.11.11",
    "scipy>=1.13.1",
    "sk>=0.0.1",
    "streamlit>=1.60.0",
    "streamlit-autorefresh>=1.0.1",
    "ulid-py>=1.1.0",
]

# Optional dep groups — the `lia` CLI + Streamlit dashboard core need
# none of these. Install locally with `uv sync --extra <group>` (or
# `--all-extras`). Kept optional so servers on older glibc (Amazon
# Linux 2, etc.) can install a slim core without hitting native-wheel
# platform mismatches.
[project.optional-dependencies]
# torcher_knn.py / torcher_linear.py — experimental ML scripts.
ml = [
    "torch>=2.9.0",
    "torchaudio>=2.9.0",
    "torchvision>=0.24.0",
]
# openaier.py — LLM/RAG features (chromadb pulls onnxruntime, which
# needs glibc >= 2.27).
llm = [
    "chromadb>=1.3.4",
    "openai>=2.7.2",
]
# song_maker.py / bass_song_maker.py — audio synthesis.
audio = [
    "pydub>=0.25.1",
    "simpleaudio>=1.0.4",
]
# discorder.py / redder.py — Discord + Reddit bot integrations.
chat = [
    "discord>=2.3.2",
    "praw>=7.8.1",
]
# Convenience — pull everything in one go.
all = [
    "torch>=2.9.0",
    "torchaudio>=2.9.0",
    "torchvision>=0.24.0",
    "chromadb>=1.3.4",
    "openai>=2.7.2",
    "pydub>=0.25.1",
    "simpleaudio>=1.0.4",
    "discord>=2.3.2",
    "praw>=7.8.1",
]

[project.scripts]
lia = "julia.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
